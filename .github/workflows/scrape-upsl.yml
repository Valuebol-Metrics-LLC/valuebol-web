# Runs the UPSL scraper every Monday morning (and whenever you press "Run workflow"
# under the Actions tab), then commits new logos, links, rosters and results.
name: Scrape UPSL

on:
  schedule:
    - cron: '17 10 * * 1' # Mondays, ~5am Eastern
  workflow_dispatch:
    inputs:
      command:
        description: 'teams, rosters, results or all'
        default: 'all'
      limit:
        description: 'Only the first N clubs (blank = all)'
        default: ''
      names:
        description: 'Only clubs whose names contain these words, comma-separated (blank = all)'
        default: ''

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/test_scraper.py
      - name: Scrape
        run: |
          ARGS="${{ github.event.inputs.command || 'all' }}"
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          NAMES=()
          IFS=',' read -ra PARTS <<< "${{ github.event.inputs.names }}"
          for n in "${PARTS[@]}"; do n="$(echo "$n" | xargs)"; [ -n "$n" ] && NAMES+=(--name "$n"); done
          python scraper/upsl_scraper.py $ARGS "${NAMES[@]}"
      - name: Commit changes
        run: |
          git config user.name "valuebol-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/logos src/data/upsl
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "UPSL data update $(date -u +%Y-%m-%d)"
          # main may have moved while the scrape ran; put this commit on top
          git pull --rebase -X theirs origin main
          git push
